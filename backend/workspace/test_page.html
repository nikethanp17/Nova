<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NOVA Local Verification Portal</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            background: #090a0f;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px border-white/10;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(8px);
        }
        h1 {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            color: #a78bfa;
        }
        input {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.4);
            color: white;
            border-radius: 0.5rem;
            box-sizing: border-box;
        }
        input:focus {
            outline: 1px solid #8b5cf6;
        }
        button {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        #success-message {
            margin-top: 1.5rem;
            padding: 0.75rem;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #34d399;
            border-radius: 0.5rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>NOVA Local Verification</h1>
        <input type="text" id="username-input" placeholder="Enter test query username...">
        <button id="submit-btn" onclick="submitForm()">Run Verification Action</button>
        <div id="success-message" style="display: none;">Verification Success: Action Completed Successfully!</div>
    </div>

    <script>
        function submitForm() {
            const inputVal = document.getElementById('username-input').value;
            if (inputVal.trim() !== '') {
                document.getElementById('success-message').style.display = 'block';
            }
        }
    </script>
</body>
</html>
