version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: nova_backend
    ports:
      - "8000:8000"
    volumes:
      - ../:/app
    environment:
      - APP_ENV=development
      - DEBUG=true
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173
      - RATE_LIMIT_PER_MINUTE=100
    restart: unless-stopped
